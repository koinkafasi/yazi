# imlec-typer — particle cursor effect
# Linux:   ~/.config/particle-cursor/config.toml
# Windows: %APPDATA%\particle-cursor\config.toml
#
# Edits are picked up live; no restart needed.

[general]
enabled = true
fps = 60

# Hard ceiling on live particles. Lower it on weak hardware.
max_particles = 600

# Reference cursor height in pixels. Particle size = cursor_height_px * size_ratio,
# so the default 20 * 0.5 gives particles half the height of the caret.
cursor_height_px = 20.0

# Nudge the spawn point away from the pointer hotspot.
offset_x = 0.0
offset_y = 0.0

# Fast consecutive keystrokes ramp the particle count up, power-mode style.
combo_enabled = true
combo_window_ms = 600
combo_max_multiplier = 2.5

# Keys firing faster than this emit nothing. Guards against held-key repeat floods.
min_emit_interval_ms = 16

# Fallback content mode for the system-wide overlay (Rust binary).
# The overlay cannot know the typed character, so it uses this mode.
# Options: shape | random_digit | random_letter | random_symbol | emoji
fallback_content = "shape"


# --- Typing: letters, digits, space, enter, arrows ---------------------------
[typing]
enabled = true
count = 6

# circle | square | triangle | diamond | star | spark | hexagon
shape = "circle"

size_ratio = 0.5
size_jitter = 0.4

lifetime_ms = 500
lifetime_jitter = 0.3

speed = 130.0
speed_jitter = 0.6

# Emission cone. 0 = right, -90 = up, 90 = down. spread_deg 360 = all directions.
direction_deg = -90.0
spread_deg = 140.0

# Downward acceleration px/s^2. Negative floats particles upward.
gravity = 320.0
drag = 1.8
rotation_speed = 3.0
shrink = true

[typing.content]
# What content spawns when typing.
# glyph          -> the actual character typed (editor-only)
# random_digit   -> random 0-9
# random_letter  -> random a-zA-Z
# random_symbol  -> random from symbol_set
# emoji          -> random from emoji_set
# shape          -> geometric shape (original imlec behaviour)
mode = "shape"

emoji_set = ["🔥", "💥", "✨", "⚡", "🎯", "💻", "🚀", "⭐"]
symbol_set = ["{", "}", ";", "/", "<", ">", "=", "+", "-", "*", "&", "|", "!", "?"]

[typing.effects]
# Visual effects (editor-only, CSS-based)
glow = true            # text-shadow glow
explode = true         # outward burst on keypress
trail = false          # leave a fading trail
rotate_3d = false      # CSS 3D rotateX/Y

[typing.color]
# mode = "fixed"    -> color   = "#ff2d95"
# mode = "palette"  -> colors  = ["#ff2d95", "#2de2e6"]
# mode = "gradient" -> from/to = "#ff2d95" / "#2de2e6"
# mode = "rainbow"  -> speed, saturation, value
mode = "palette"
colors = ["#ff2d95", "#ff9f1c", "#2de2e6", "#a06cff", "#f9f871"]


# --- Deleting: backspace, delete ---------------------------------------------
[deleting]
enabled = true
count = 8
shape = "spark"
size_ratio = 0.5
size_jitter = 0.4
lifetime_ms = 340
lifetime_jitter = 0.3
speed = 90.0
speed_jitter = 0.6
direction_deg = 90.0
spread_deg = 360.0
gravity = -60.0
drag = 1.8
rotation_speed = 3.0
shrink = true

[deleting.content]
mode = "emoji"
emoji_set = ["💨", "❌", "🗑️", "💥"]

[deleting.effects]
glow = false
explode = true
trail = false
rotate_3d = false

[deleting.color]
mode = "fixed"
color = "#ff3b30"


# ────────────────────────────────────────────
# Presets — switch via tray menu or command
# ────────────────────────────────────────────

[preset.matrix]
name = "Matrix"
content_mode = "random_symbol"
color_mode = "fixed"
color = "#00ff41"
glow = true
gravity = 80
drag = 0.5
speed = 60

[preset.fireworks]
name = "Fireworks"
content_mode = "emoji"
emoji_set = ["🎆", "✨", "⭐", "🎇", "💫"]
explode = true
gravity = -40
spread_deg = 360
speed = 100

[preset.typewriter]
name = "Typewriter"
content_mode = "glyph"
color_mode = "fixed"
color = "#d4a373"
size_ratio = 0.7
gravity = 250
lifetime_ms = 400

[preset.rainbow_code]
name = "Rainbow Code"
content_mode = "glyph"
color_mode = "rainbow"
rotate_3d = true
speed = 150
spread_deg = 180

[preset.minimal]
name = "Minimal"
content_mode = "shape"
shape = "circle"
color_mode = "fixed"
color = "#888888"
count = 3
gravity = 400
lifetime_ms = 300
